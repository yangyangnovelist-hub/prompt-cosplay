name: PromptCosplay

on:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes github:yangyangnovelist-hub/prompt-cosplay#5359d5042f0d3bee76d5e5f4af000efbd5aceb2d audit . --fail-under 55
